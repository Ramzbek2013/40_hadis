        function startTimer() {
            clearInterval(timerInterval);
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.width = '100%';
            
            startTime = Date.now();
            const duration = 5000; // 5 seconds

            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, duration - elapsed);
                const percent = (remaining / duration) * 100;
                timerBar.style.width = ${percent}%;

                if (elapsed >= duration) {
                    clearInterval(timerInterval);
                    if (!userHasAnswered) {
                        processTurn(null, false, 0);
                    }
                }
            }, 50);
        }

        function selectAnswer(selected, correct, btnElement) {
            if (userHasAnswered) return;
            userHasAnswered = true;
            clearInterval(timerInterval);

            const timeTaken = (Date.now() - startTime) / 1000; // in seconds
            const isCorrect = (selected === correct);

            // Button styling
            if (isCorrect) {
                btnElement.classList.remove('bg-slate-800/80', 'hover:bg-indigo-600/50');
                btnElement.classList.add('bg-emerald-600', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-800/80', 'hover:bg-indigo-600/50');
                btnElement.classList.add('bg-rose-600', 'text-white');
            }

            // Score logic based on speed (max 1000 pts for 0s, down to 500 pts at 5s)
            let points = 0;
            if (isCorrect) {
                points = Math.round(1000 - (timeTaken * 100));
                if (points < 500) points = 500;
            }

            processTurn(selected, isCorrect, points);
        }
